server:
  port: 8085

spring:
  application:
    name: recommendation-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/recommendation?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&createDatabaseIfNotExist=true
    username: ${DB_USER:root}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

internal:
  token: ${INTERNAL_TOKEN:local-dev-internal-token}

jwt:
  secret: ${JWT_SECRET:dev-only-not-a-real-secret-0123456789abcdef}
