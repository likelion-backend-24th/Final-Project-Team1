server:
  port: 8086

spring:
  application:
    name: settlement-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

internal:
  token: ${INTERNAL_TOKEN:local-dev-internal-token}

reservation-service:
  base-url: ${RESERVATION_SERVICE_URL:http://localhost:8083}
  connect-timeout: 2s
  read-timeout: 3s

expo-service:
  base-url: ${EXPO_SERVICE_URL:http://localhost:8082}
  connect-timeout: 2s
  read-timeout: 3s

gemini:
  api-key: ${GEMINI_API_KEY:}
  connect-timeout: 3s
  read-timeout: 4s
  max-attempts: 1

jwt:
  secret: ${JWT_SECRET:dev-only-not-a-real-secret-0123456789abcdef}
