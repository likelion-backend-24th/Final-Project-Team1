scheduler:
  reservation-expiry:
    enabled: false   # Test 에서 만료 배치가 제멋대로 돌면 다른 Test 의 예약을 EXPIRED 로 바꾼다

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
