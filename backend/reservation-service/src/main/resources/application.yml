server:
  port: 8083

spring:
  application:
    name: reservation-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/reservation?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:root}


  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration


expo-service:
  base-url: ${EXPO_SERVICE_URL:http://localhost:8082}
  connect-timeout: 2s
  read-timeout: 3s

scheduler:
  reservation-expiry:
    enabled: ${RESERVATION_EXPIRY_ENABLED:true}
    cron: "0 */2 * * * *"
    # 유예 상한. PG 가 계속 모른다고 하면 결제대기 창과 같은 길이를 한 번 더 주고 만료시킨다.
    grace: 10m
    batch-size: 200
    # PG 조회가 필요한 갈래에만 걸리는 상한. 배치가 외부 호출에 밀리지 않게 한다.
    pg-batch-size: 50

  # 티켓 발급 통지 재시도(#79). 즉시 시도에 실패한 건을 회수한다.
  ticket-dispatch:
    enabled: ${TICKET_DISPATCH_ENABLED:true}
    cron: "0 * * * * *"
    batch-size: 100
    max-attempts: 6
    # 지수 백오프의 기준값. 1·2·4·8·16분 뒤에 재시도하고 6회째에 포기한다.
    backoff: 1m

ticket-service:
  base-url: ${TICKET_SERVICE_URL:http://localhost:8084}
  connect-timeout: 2s
  read-timeout: 3s

internal:
  token: ${INTERNAL_TOKEN:local-dev-internal-token}

portone:
  store-id: ${PORTONE_STORE_ID:store-dev-placeholder}
  channel-key: ${PORTONE_CHANNEL_KEY:channel-key-dev-placeholder}
  api-secret: ${PORTONE_API_SECRET:dev-only-placeholder}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:whsec_ZGV2LW9ubHktcGxhY2Vob2xkZXItbm90LWEtcmVhbC1rZXk=}

# 개발·CI 기본값. 실제 값은 JWT_SECRET 환경변수가 덮어쓴다
jwt:
  secret: ${JWT_SECRET:dev-only-not-a-real-secret-0123456789abcdef}
