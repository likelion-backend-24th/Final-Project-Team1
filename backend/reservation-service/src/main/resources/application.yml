server:
  port: 8083

spring:
  application:
    name: reservation-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/reservation?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:root}


  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration


expo-service:
  base-url: ${EXPO_SERVICE_URL:http://localhost:8082}
  connect-timeout: 2s
  read-timeout: 3s

internal:
  token: ${INTERNAL_TOKEN:local-dev-internal-token}

portone:
  store-id: ${PORTONE_STORE_ID:store-dev-placeholder}
  channel-key: ${PORTONE_CHANNEL_KEY:channel-key-dev-placeholder}
  api-secret: ${PORTONE_API_SECRET:dev-only-placeholder}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:whsec_ZGV2LW9ubHktcGxhY2Vob2xkZXItbm90LWEtcmVhbC1rZXk=}

# 개발·CI 기본값. 실제 값은 JWT_SECRET 환경변수가 덮어쓴다
jwt:
  secret: ${JWT_SECRET:dev-only-not-a-real-secret-0123456789abcdef}
