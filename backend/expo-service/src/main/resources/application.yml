server:
  port: 8082

spring:
  application:
    name: expo-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/expo?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:root}
    # password는 시크릿이므로 application-local.yml(또는 환경변수)에서 채운다
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

internal:
  token: ${INTERNAL_TOKEN:local-dev-internal-token}

# reservation-service 내부 호출(#24 회차 존재 확인, #26 회차 목록 병합)용. 재시도 없음.
reservation-service:
  base-url: ${RESERVATION_SERVICE_URL:http://localhost:8083}
  connect-timeout: 2s
  read-timeout: 3s

scheduler:
  auto-close:
    cron: "0 */10 * * * *"
    limit: 500

app:
  base-url: ${APP_BASE_URL:http://localhost:8082}

portone:
  stub: ${PORTONE_STUB:true}
  store-id: ${PORTONE_STORE_ID:store-dev-placeholder}
  channel-key: ${PORTONE_CHANNEL_KEY:channel-key-dev-placeholder}
  api-secret: ${PORTONE_API_SECRET:dev-only-placeholder}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:whsec_ZGV2LW9ubHktcGxhY2Vob2xkZXItbm90LWEtcmVhbC1rZXk=}

# 개발·CI 기본값. 실제 값은 JWT_SECRET 환경변수가 덮어쓴다
jwt:
  secret: ${JWT_SECRET:dev-only-not-a-real-secret-0123456789abcdef}
