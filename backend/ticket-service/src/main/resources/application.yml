server:
  port: 8084

spring:
  application:
    name: ticket-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    # createDatabaseIfNotExist: 기존 도커 볼륨에는 init.sql이 다시 실행되지 않아 ticket DB가 없을 수 있다.
    # 기동 시 DB(스키마 네임스페이스)만 자동 생성하고, 테이블은 계속 Flyway가 소유한다.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/ticket?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    # password는 시크릿이므로 application-local.yml(또는 환경변수)에서 채운다

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

internal:
  token: ${INTERNAL_TOKEN:local-dev-internal-token}

# 체크인 소유권 검증(#7): 박람회-Service getExpoInternal 호출. 연결 2s·응답 3s(계약).
expo-service:
  base-url: ${EXPO_SERVICE_URL:http://localhost:8082}
  connect-timeout: 2s
  read-timeout: 3s

# 체크인 시간창(S7-3): 예약-Service getRoundInternal 호출. 실패해도 체크인은 허용한다(fail-open).
reservation-service:
  base-url: ${RESERVATION_SERVICE_URL:http://localhost:8083}
  connect-timeout: 2s
  read-timeout: 3s

checkin:
  # 회차 시작 이 시간 전부터 ~ 회차 종료까지 체크인할 수 있다.
  opens-before: ${CHECKIN_OPENS_BEFORE:1h}

recommendation-service:
  base-url: ${RECOMMENDATION_SERVICE_URL:http://localhost:8085}
  connect-timeout: 2s
  read-timeout: 3s

# 개발·CI 기본값. 실제 값은 JWT_SECRET 환경변수가 덮어쓴다
jwt:
  secret: ${JWT_SECRET:dev-only-not-a-real-secret-0123456789abcdef}
