server:
  port: 8084

spring:
  application:
    name: ticket-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/ticket?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:root}
    # password는 시크릿이므로 application-local.yml(또는 환경변수)에서 채운다

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

internal:
  token: ${INTERNAL_TOKEN:local-dev-internal-token}

# 개발·CI 기본값. 실제 값은 JWT_SECRET 환경변수가 덮어쓴다
jwt:
  secret: ${JWT_SECRET:dev-only-not-a-real-secret-0123456789abcdef}
