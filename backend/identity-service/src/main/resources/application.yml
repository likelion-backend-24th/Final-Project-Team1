server:
  port: 8081

spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/identity?characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:team1local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    placeholders:
      superAdminEmail: ${SUPER_ADMIN_EMAIL:admin@team1.local}
      superAdminPasswordHash: ${SUPER_ADMIN_PASSWORD_HASH}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000