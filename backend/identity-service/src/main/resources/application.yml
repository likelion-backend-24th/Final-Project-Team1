server:
  port: 8081

spring:
  application:
    name: identity-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/identity?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:root}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    placeholders:
      superAdminEmail: ${SUPER_ADMIN_EMAIL:admin@team1.local}
      superAdminPasswordHash: ${SUPER_ADMIN_PASSWORD_HASH:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

jwt:
  # 개발·CI 기본값. 실제 값은 JWT_SECRET 환경변수가 덮어쓴다
  secret: ${JWT_SECRET:dev-only-not-a-real-secret-0123456789abcdef}
  access-token-expiration: 3600000
